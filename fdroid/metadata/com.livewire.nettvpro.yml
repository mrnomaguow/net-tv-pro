AutoName: NetTV Pro
Description: |-
  NetTV Pro is a live TV player and DVR studio for your phone. Watch
  free live streams, browse channels, check the programme guide, and
  schedule and keep recordings. It includes preset free channels and
  can search the public IPTV-org directory to find and add more
  stations, import channels from an M3U playlist, and play video
  fullscreen with Prev / Next channel buttons.

